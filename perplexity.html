<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Damon Versaggi | Perplexity · Product Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* Single-file portfolio styles.
   Responsive sections retain cascade dependencies where combining them would
   alter the approved layout. Project link height is defined once. */

/* =========================
   ANIMATIONS
   ========================= */
@keyframes panel-scan {
0%{box-shadow:inset 0 2px #acfff07a}45%{box-shadow:inset 0 0 50px #8affec18}100%{box-shadow:inset 0 0 0 transparent}
}
@keyframes orbit-spin {
to{transform:rotate(360deg)}
}
@keyframes orbit-spin-reverse {
to{transform:rotate(-360deg)}
}
@keyframes scan-sweep {
0%,12%{transform:translateY(-40vh) rotate(-8deg);opacity:0}
  25%{opacity:.55}
  62%{opacity:.2}
  78%,100%{transform:translateY(128vh) rotate(-8deg);opacity:0}
}

/* =========================
   SHARED STYLES
   ========================= */

/* RESET / VARIABLES / SHARED CONTROLS */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  --bg: #08131d;
  --gr: #122334;
  --ed: rgba(155,234,255,.24);
  --tx: #f3fbff;
  --mu: #c9d7e3;
  --br: #62f3ff;
  --holo: #aaf7ff;
}
* {
  box-sizing: inherit;
  margin: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(225,239,245,.38) rgba(225,239,245,.04);
}
html {
  height: 100%;
  color: var(--tx);
  font: 400 15px/1.5 Archivo,system-ui,sans-serif;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, rgba(182,235,255,.09), transparent 38%),
    radial-gradient(ellipse at 18% 18%, rgba(88,231,255,.11), transparent 34%),
    radial-gradient(ellipse at 82% 18%, rgba(162,118,255,.10), transparent 36%),
    radial-gradient(ellipse at 50% 100%, rgba(92,225,255,.07), transparent 46%),
    #08131d !important;
}
body {
  height: 100%;
  color: var(--tx);
  font: 400 15px/1.5 Archivo,system-ui,sans-serif;
  overflow: hidden;
  position: relative;
  isolation: isolate;
  background: radial-gradient(ellipse at 50% 0%, rgba(182,235,255,.09), transparent 38%),
    radial-gradient(ellipse at 18% 18%, rgba(88,231,255,.11), transparent 34%),
    radial-gradient(ellipse at 82% 18%, rgba(162,118,255,.10), transparent 36%),
    radial-gradient(ellipse at 50% 100%, rgba(92,225,255,.07), transparent 46%),
    #08131d !important;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--br);
  outline-offset: 3px;
}

/* BANDS / NAVIGATION / ACTIVE STATES */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  position: relative;
  z-index: 3;
}

/* HEADER / RESUME TRIGGER */
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  padding: 4px 6px 6px;
  flex: none;
}
header h1 {
  font: 800 40px/.92 Archivo,system-ui,sans-serif;
  letter-spacing: .01em;
  text-transform: uppercase;
  background: linear-gradient(110deg,#f3ffff 5%,#c8fff0 52%,#dcc7ff 100%);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 10px rgba(220,244,255,.09));
}
header p {
  color: var(--mu);
  font-size: 13px;
  margin-top: 4px;
  max-width: none;
}
.hb {
  display: flex;
  gap: 14px;
  font: 500 12px Archivo,sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--mu);
  white-space: nowrap;
  align-items: center;
}
.hb button:hover {
  color: var(--tx);
}
.hb .go {
  color: var(--br);
}
.band {
  flex: 2 1 0;
  min-height: 64px;
  display: flex;
  border: 1px solid var(--ed);
  overflow: hidden;
  position: relative;
  transition: flex-grow .55s cubic-bezier(.7,0,.2,1),border-color .3s;
  border-radius: 10px;
  background: linear-gradient(125deg, rgba(52,95,115,.50), rgba(25,41,59,.58) 45%, rgba(73,64,108,.42)) !important;
  border-color: rgba(176,235,255,.22) !important;
  box-shadow: inset 0 1px rgba(244,252,255,.18),
    inset 0 -1px rgba(14,24,33,.30),
    0 8px 24px rgba(0,0,0,.18),
    0 0 0 1px rgba(135,210,255,.04) !important;
  backdrop-filter: blur(17px) saturate(145%);
  -webkit-backdrop-filter: blur(17px) saturate(145%);
}
.band::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(110deg,#73ffe807,transparent 35%,#b498ff08),repeating-linear-gradient(0deg,transparent 0 4px,#adffec03 4px 5px);
  z-index: 0;
}
.gut {
  flex: none;
  width: 248px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--ed);
  z-index: 2;
  background: linear-gradient(135deg, rgba(31,55,70,.72), rgba(15,27,38,.82)) !important;
  border-color: rgba(176,236,255,.18) !important;
  box-shadow: inset 0 1px rgba(251,253,255,.10) !important;
}
.gut h2 {
  font: 700 14px/1.35 Archivo,sans-serif;
  letter-spacing: .20em;
  cursor: pointer;
  flex: none;
  text-shadow: 0 0 12px #6affdb35;
}
.toc {
  list-style: none;
  padding: 0;
  margin: 16px 0 8px;
  flex: 1;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
}
.toc li {
  font: 500 14px/1.3 Archivo,sans-serif;
  letter-spacing: .01em;
  padding: 9px 2px;
  border-top: 1px solid var(--ed);
  cursor: pointer;
  transition: color .2s;
  white-space: normal;
  overflow: visible;
  word-break: normal;
}
.toc li:first-child {
  border-top: 0;
}
.toc li:hover {
  color: var(--mu);
}
.toc li b {
  display: block;
  font: 700 10.5px Archivo,sans-serif;
  letter-spacing: .16em;
  color: #454a4f;
  margin-bottom: 3px;
  font-size: 11px;
}
.ctl {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 500 13px Archivo,sans-serif;
  letter-spacing: .12em;
  color: var(--mu);
  flex: none;
}
.ctl button {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--ed);
  transition: border-color .2s,transform .12s,color .2s;
  background: linear-gradient(130deg,#24435170,#27213c65);
  border-color: rgba(198,237,255,.24) !important;
  box-shadow: inset 0 1px rgba(252,254,255,.16),
    0 4px 14px rgba(0,0,0,.14),
    0 0 0 1px rgba(130,215,255,.04) !important;
}
.ctl button svg {
  transition: transform .2s;
}
.ctl .pv:hover:not(:disabled) svg {
  transform: translateX(-3px);
}
.ctl .nx:hover:not(:disabled) svg {
  transform: translateX(3px);
}
.ctl button:active:not(:disabled) {
  transform: scale(.94);
}
.ctl .ct {
  margin-left: 6px;
  letter-spacing: .08em;
}
.ctl button:disabled {
  opacity: .3;
  cursor: default;
}
.bar {
  height: 2px;
  margin: 8px 0;
}
.bar i {
  display: block;
  height: 100%;
  width: 0;
  transition: width .5s;
  box-shadow: 0 0 12px rgba(115,240,255,.42);
}
.vp {
  flex: 1;
  overflow: hidden;
  position: relative;
  touch-action: pan-y;
  z-index: 1;
}
.trk {
  display: flex;
  height: 100%;
  transition: transform .6s cubic-bezier(.7,0,.2,1);
}

/* PROJECT SLIDES / TYPOGRAPHY */
.sl {
  flex: none;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0,1.3fr) minmax(0,.95fr);
  gap: 22px;
  padding: 14px 24px;
  align-items: center;
  overflow: auto;
}
.sl h3 {
  font: 800 clamp(27px,4vw,54px)/.98 Archivo,system-ui,sans-serif;
  letter-spacing: .005em;
  text-transform: uppercase;
  background: linear-gradient(110deg,#f3ffff 5%,#c8fff0 52%,#dcc7ff 100%);
  -webkit-background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 10px rgba(220,244,255,.09));
}
.sub {
  margin: 8px 0 18px;
  font: 700 clamp(15px,1.4vw,19px)/1.25 Archivo,system-ui,sans-serif;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: #6cf3ff !important;
  text-shadow: 0 0 10px rgba(108,243,255,.18);
}
.blk {
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 4px 14px;
  padding: 8px 0;
  border-top: 1px solid var(--ed);
  max-width: 66ch;
}
.blk b {
  font: 600 10.5px Archivo,sans-serif;
  letter-spacing: .2em;
  color: var(--mu);
  padding-top: 4px;
}

/* PROJECT MEDIA / LINKS / IMAGE VIEWER */
.ph {
  aspect-ratio: 16/10;
  max-height: 100%;
  border: 1px solid var(--ed);
  border-radius: 4px;
  position: relative;
  background: linear-gradient(135deg,#1c1e21,#0e0f10);
  background-image: linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size: 32px 32px;
  display: flex;
  align-items: flex-end;
  padding: 12px;
  font: 500 10.5px Archivo,sans-serif;
  letter-spacing: .22em;
  color: #666d74;
}
.ph::before {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1px solid #555b61;
  top: 8px;
  left: 8px;
  border-right: 0;
  border-bottom: 0;
}
.ph::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1px solid #555b61;
  top: 8px;
  right: 8px;
  border-left: 0;
  border-bottom: 0;
}
.ex {
  grid-column: 1/-1;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 6px 28px;
  margin-top: 10px;
}
.ex div {
  border-top: 1px solid var(--ed);
  padding: 8px 0;
}
.ex strong {
  display: block;
  font: 700 20px/1.15 Archivo,system-ui,sans-serif;
  letter-spacing: .005em;
  text-transform: uppercase;
}
.ex small {
  color: var(--mu);
  font-size: 13px;
}
.note {
  grid-column: 1/-1;
  color: var(--mu);
  font-size: 13px;
  max-width: 76ch;
}
.band:not(.on) .sl>*:not(.tx),
.band:not(.on) .tx>*:not(h3):not(.sub),
.band:not(.on) .sub.ad {
  display: none;
}
.band:not(.on) .sub {
  margin: 5px 0 0;
  font-size: clamp(11px,1vw,15px);
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  line-height: 1.15;
  max-width: 100%;
  text-shadow: none;
  color: #90a4b4 !important;
  opacity: .56;
}
.band:not(.on) .sl {
  align-items: center;
  padding: 4px 20px;
  overflow: visible;
}
.band:not(.on) .sl h3 {
  font-size: clamp(18px,2vw,28px);
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  line-height: .98;
  max-width: 100%;
  background: none;
  text-shadow: none;
  color: #b4c0ca;
  -webkit-text-fill-color: #b4c0ca;
  opacity: .68;
  filter: none;
}
.band:not(.on) .ctl button,
.band:not(.on) .toc {
  display: none;
}

/* RESUME / THESIS */
.grp {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 18px;
}
.grp h4 {
  font: 600 11px Archivo,sans-serif;
  letter-spacing: .22em;
  color: var(--br);
  margin-bottom: 6px;
}
.grp p {
  font-size: 13.5px;
  margin: 0;
}
.dlbtn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  padding: 12px 20px;
  border: 1px solid var(--br);
  background: var(--br);
  font: 600 12px Archivo,sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-decoration: none;
  transition: transform .12s,filter .2s;
  color: #000!important;
  -webkit-text-fill-color: #000;
  text-shadow: none;
  border-radius: 8px;
}
.dlbtn:hover {
  filter: brightness(1.08);
}
.dlbtn:active {
  transform: scale(.97);
}
.dlbtn svg {
  width: 16px;
  height: 16px;
  color: #000!important;
  stroke: #000;
}
.dlbtn:link,
.dlbtn:visited,
.dlbtn:hover,
.dlbtn:active {
  color: #000!important;
  -webkit-text-fill-color: #000;
  text-shadow: none;
}
.ph.has-photo {
  min-width: 0;
  isolation: isolate;
  aspect-ratio: 16/9;
  border: 0;
  background: none;
  box-shadow: none;
  padding: 0;
  border-radius: 7px;
  overflow: hidden;
}
.ph.has-photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-position: center;
  display: block;
  object-fit: contain;
}
.thesis-row {
  display: grid;
  align-items: start;
}
.thesis-photo {
  width: 100%;
  margin: 0;
}
.thesis-photo img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 7px;
}
.sl.text-only {
  grid-template-columns: minmax(0,1fr);
}
.project-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px !important;
  margin-top: 8px !important;
}
.project-links a {
  max-width: 100%;
  font: 500 12px/1.4 Archivo,system-ui,sans-serif;
  text-decoration: none;
  overflow-wrap: anywhere;
  border-radius: 8px;
  backdrop-filter: blur(14px) saturate(135%);
  transition: background .2s,border-color .2s,box-shadow .2s;
  border-color: rgba(198,237,255,.24) !important;
  box-shadow: inset 0 1px rgba(252,254,255,.16),
    0 4px 14px rgba(0,0,0,.14),
    0 0 0 1px rgba(130,215,255,.04) !important;
  color: #eaf8ff !important;
  background: linear-gradient(180deg, rgba(242,251,255,.16), rgba(159,213,245,.05) 48%, rgba(183,170,255,.10)) !important;
  box-sizing: border-box;
  width: 100% !important;
  height: 34px !important;
  min-height: 34px;
  max-height: 34px;
  padding: 0 10px !important;
  display: flex !important;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 11px !important;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
a {
  text-transform: uppercase;
}
.band.on .sl .tx {
  min-width: 0;
}
.band.on .sl .ph {
  align-self: start;
}
.blk span {
  min-width: 0;
  overflow-wrap: break-word;
  color: #e9f3fa;
}
.header-quote {
  font-family: Archivo,system-ui,sans-serif;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: .24em;
  text-shadow: 0 0 12px #00e5e514;
  color: #6cf3ff !important;
}
.thesis-row p {
  line-height: 1.6;
  margin-bottom: 10px;
}
.thesis-row p[style] {
  margin-top: 26px!important;
}
.project-media {
  min-width: 0;
  align-self: start;
}
.project-media .ph {
  width: 100%;
  max-height: none;
  outline: 1px solid transparent;
  outline-offset: 4px;
  transition: outline-color .25s,filter .25s;
}
.sl h3 {
  color: transparent;
}
.ph.has-photo {
  max-height: none;
}
.ph.has-photo::before,
.ph.has-photo::after {
  display: none!important;
}
.project-media .project-links {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  gap: 6px !important;
  margin-top: 8px !important;
}
.project-media .project-links a {
  flex: none;
  max-width: 100%;
}
.overview-copy {
  max-width: 68ch;
  margin-top: 20px;
  text-transform: none!important;
}
.overview-copy p+p {
  margin-top: 12px;
}
.overview-copy .story-lead {
  color: #edf8ff;
  line-height: 1.45;
  font-size: 22px;
  text-transform: none;
}
.story-skills {
  text-transform: none;
  padding-top: 12px;
  border-top: 1px solid var(--ed);
  line-height: 1.5;
  color: #6cf3ff !important;
}
.experience-intro {
  max-width: 80ch;
  margin-top: 14px;
  color: #edf8ff;
}
.experience-proof {
  max-width: 85ch;
  margin-top: 8px;
}
.experience-note {
  max-width: 85ch;
  margin-top: 8px;
  color: var(--mu);
}
.band:not(.on) .overview-copy,
.band:not(.on) .experience-intro,
.band:not(.on) .experience-proof,
.band:not(.on) .experience-note {
  display: none;
}
.gut h2 {
  font-size: 16px;
  color: #eff8ff;
}
.toc li {
  font-size: 16px;
  line-height: 1.35;
  color: #7f93a2;
}
.overview-copy .story-skills {
  font-size: 14px;
  text-transform: none;
}
.ctl button {
  border-radius: 8px;
}
.ph.has-photo[role="button"] {
  cursor: zoom-in;
}
.project-image-view {
  position: absolute;
  inset: 0;
  z-index: 5;
  width: 100%;
  height: 100%;
  padding: 12px;
  background: rgba(6,11,18,.94);
  display: grid;
  place-items: center;
  cursor: zoom-out;
  border-radius: 8px;
  touch-action: pan-y;
}
.project-image-view img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: contain;
  opacity: .9;
  pointer-events: none;
}
.project-image-view span {
  position: absolute;
  right: 12px;
  bottom: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  background: #060b12d9;
  color: var(--br);
  font-size: 11px;
  letter-spacing: .06em;
}
.vp.image-open>.trk {
  visibility: hidden;
}
::-webkit-scrollbar {
  width: 7px;
}
::-webkit-scrollbar-track {
  background: rgba(225,239,245,.04);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb {
  background: rgba(225,239,245,.38);
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(235,248,255,.58);
  background-clip: padding-box;
}
.band.on::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(340px circle at var(--pointer-x,65%) var(--pointer-y,45%),#64ffed10,transparent 75%);
}
.band.on::after {
  background: linear-gradient(110deg,#73ffe807,transparent 35%,#b498ff08),repeating-linear-gradient(0deg,transparent 0 4px,#adffec04 4px 5px);
}
.band.holo-scan::after {
  animation: panel-scan .7s ease-out;
}
.project-media .ph:focus-visible {
  outline-color: #9affec;
}
.thesis-copy .sub {
  margin: 0 0 18px;
  font-size: 16px;
  line-height: 1.3;
}
.thesis-copy .blk {
  grid-template-columns: 100px minmax(0,1fr);
  padding: 12px 0;
}
.thesis-media {
  min-width: 0;
}
.thesis-media .project-links {
  display: flex;
  flex-direction: column;
  gap: 6px !important;
  margin-top: 8px !important;
}
.band:not(.on) {
  flex-grow: 1;
  opacity: .66;
  filter: saturate(.58) brightness(.78);
  background: linear-gradient(125deg,
      rgba(196,220,232,.085),
      rgba(95,116,132,.075) 46%,
      rgba(156,148,182,.075)) !important;
  backdrop-filter: blur(14px) saturate(72%) brightness(.82);
  cursor: pointer;
}
.band.on {
  flex-grow: 10;
  border-color: rgba(198,244,255,.46) !important;
  box-shadow: inset 0 1px rgba(252,254,255,.24),
    0 0 30px rgba(111,233,255,.10),
    0 0 65px rgba(126,181,255,.08),
    0 10px 30px rgba(0,0,0,.20) !important;
  backdrop-filter: blur(17px) saturate(145%);
  -webkit-backdrop-filter: blur(17px) saturate(145%);
}
.resume-card {
  grid-column: 1/-1;
  width: 100%;
  min-width: 0;
}
.resume-content {
  margin-top: 14px;
}
.resume-content p {
  margin-bottom: 8px;
  max-width: 85ch;
  color: #e9f3fa;
}
.resume-content a {
  color: var(--br);
}
.resume-content ul {
  list-style: none;
}
.resume-content li {
  border-top: 1px solid var(--ed);
  color: #e9f3fa;
}
.resume-content .grp {
  gap: 12px 20px;
}
.resume-content .grp h4 {

/* BACKGROUND */
.ambient-bg {
  --mx: 62%;
  --my: 38%;
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: radial-gradient(circle at var(--mx) var(--my), rgba(232,246,255,.24), transparent 22%),
    radial-gradient(ellipse at 54% 56%, rgba(144,224,255,.18), transparent 34%),
    radial-gradient(ellipse at 88% 36%, rgba(179,170,255,.15), transparent 39%),
    radial-gradient(ellipse at 10% 18%, rgba(170,230,255,.14), transparent 36%),
    radial-gradient(ellipse at 50% 100%, rgba(132,228,255,.12), transparent 42%),
    linear-gradient(135deg, #0b1b27 0%, #0b1620 38%, #10182a 68%, #1a1823 100%) !important;
}
.ambient-bg::before {
  content: "";
  position: absolute;
  inset: -8%;
  background-image: linear-gradient(rgba(91,220,231,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(91,220,231,.055) 1px,transparent 1px);
  background-size: 42px 42px;
  transform: perspective(900px) rotateX(64deg) translateY(29%);
  transform-origin: center bottom;
  -webkit-mask-image: linear-gradient(to bottom,transparent 3%,#000 36%,#000 88%,transparent);
  opacity: .62;
}
.ambient-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  mix-blend-mode: screen;
  background: repeating-linear-gradient(0deg, rgba(247,250,255,.04) 0 1px, transparent 1px 5px),
    radial-gradient(ellipse at center, transparent 36%, rgba(18,31,43,.07) 78%, rgba(6,11,16,.18) 100%) !important;
}
.hud-orbit {
  position: absolute;
  left: 82%;
  top: 8%;
  transform: translateX(-50%);
}
.hud-orbit .ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
}
.hud-orbit .ring.r1 {
  inset: 4%;
  box-shadow: inset 0 0 46px rgba(222,247,255,.10), 0 0 36px rgba(132,233,255,.18);
}
.hud-orbit .ring.r2 {
  inset: 14%;
  mask: radial-gradient(circle,transparent 67%,#000 68% 70%,transparent 71%);
  animation: orbit-spin 34s linear infinite;
}
.hud-orbit .ring.r3 {
  inset: 27%;
  animation: orbit-spin-reverse 24s linear infinite;
}
.hud-orbit .core {
  position: absolute;
  inset: 40%;
  border-radius: 50%;
  border: 1px solid rgba(228,244,255,.30);
  background: radial-gradient(circle, rgba(246,252,255,.28), rgba(167,216,255,.08) 56%, transparent 76%);
  border-color: rgba(236,246,255,.34);
  box-shadow: 0 0 86px rgba(178,225,255,.18);
}
.bg-panel {
  position: absolute;
  transform: skewY(-4deg);
  box-shadow: inset 0 1px rgba(250,253,255,.20), 0 0 22px rgba(176,224,255,.08);
}
.bg-panel.p1 {
  right: 6%;
  top: 16%;
  width: 23%;
}
.bg-panel.p2 {
  left: 5%;
  top: 21%;
  width: 18%;
  transform: skewY(5deg);
}
.bg-panel.p3 {
  right: 20%;
  bottom: 8%;
  width: 22%;
  transform: skewY(3deg);
}
.circuit {
  position: absolute;
  background: linear-gradient(90deg,transparent 0 8%,rgba(206,234,255,.22) 8% 8.4%,transparent 8.4% 34%,rgba(191,225,255,.16) 34% 34.3%,transparent 34.3%),
    linear-gradient(0deg,transparent 0 18%,rgba(191,225,255,.16) 18% 18.5%,transparent 18.5% 65%,rgba(181,192,236,.12) 65% 65.5%,transparent 65.5%);
}
.circuit.c1 {
  left: 1%;
  top: 6%;
  width: 28%;
}
.circuit.c2 {
  right: 3%;
  top: 5%;
  width: 25%;
  transform: scaleX(-1);
}
.circuit.c3 {
  left: 28%;
  bottom: 2%;
  width: 42%;
  opacity: .22;
}
.data-node {
  position: absolute;
  height: 7px;
  opacity: .82;
  box-shadow: 0 0 0 6px rgba(244,249,255,.08), 0 0 26px rgba(165,228,255,.62);
}
.data-node::after {
  content: "";
  position: absolute;
  left: 9px;
  top: 3px;
  height: 1px;
  width: clamp(55px,7vw,130px);
  background: linear-gradient(90deg, rgba(224,241,255,.34), transparent);
}

  left: 10%;

}
.data-node.n2 {

}
.data-node.n3 {

}

function step(i,d){

   active=nextMainBand;
   pos[nextMainBand]=0;
   draw();

   const firstMainBand=B.findIndex(b=>!b.resume);
   if(firstMainBand!==-1){
    active=firstMainBand;
    pos[firstMainBand]=0;

   }
  }

 }

let fitFrame;
function fitProjects(){
 cancelAnimationFrame(fitFrame);
 fitFrame=requestAnimationFrame(updateProjectLayout);
}
function updateProjectLayout(){
 cancelAnimationFrame(fitFrame);

 const mobileOrPortraitTablet = matchMedia(
  '(max-width:700px), (min-width:701px) and (max-width:1180px) and (orientation:portrait)'
 ).matches;

 document.querySelectorAll('.sl').forEach(sl=>{
  const tx=sl.querySelector('.tx');
  const media=sl.querySelector('.project-media');
  const photo=media?.querySelector('.ph');

  /* Always clear obsolete desktop density classes. */
  sl.classList.remove('fit-dense','fit-tight');

  /*
    MOBILE + PORTRAIT TABLET:
    Leave the already-working locked-panel system untouched.
    fitMobileProjects() below remains the sole text fitter there.
  */
  if(mobileOrPortraitTablet){
   if(tx){
    tx.style.height='';
    tx.style.maxHeight='';
   }
   return;
  }

  sl.classList.remove('text-compact');
  /* Reset only desktop / landscape-tablet text fitting residue. */
  sl.style.removeProperty('--reading-size');

  if(tx){
   tx.style.height='';
   tx.style.maxHeight='';
  }

  if(media){
   media.style.height='';
  }

  if(photo){
   photo.style.width='';
   photo.style.height='';
  }

  if(!sl.closest('.band')?.classList.contains('on')) return;
  if(sl.classList.contains('resume-slide') || sl.classList.contains('proof-overview')) return;
  if(!tx) return;

  /*
    DESKTOP MEDIA GEOMETRY:
    Preserve the approved image/link column exactly as before.
    Text fitting does not alter it.
  */
  if(innerWidth>1180 && media && photo){
   const style=getComputedStyle(sl);
   const available=
    sl.clientHeight -
    parseFloat(style.paddingTop) -
    parseFloat(style.paddingBottom);

   if(available>0){
    const links=media.querySelector('.project-links');
    const linkHeight=
     links ? links.getBoundingClientRect().height + 8 : 0;

    media.style.height=available+'px';
    photo.style.width='100%';
    photo.style.height=Math.max(120,available-linkHeight)+'px';
   }
  }

  /*
    LOCK THE AVAILABLE TEXT BOX.
    Desktop uses the full panel height beside the fixed media column.
    Landscape tablet subtracts the already-rendered stacked media block.
  */
  const slStyle=getComputedStyle(sl);

  let availableTextHeight=
   sl.clientHeight -
   parseFloat(slStyle.paddingTop) -
   parseFloat(slStyle.paddingBottom);

  if(media){
   const txRect=tx.getBoundingClientRect();
   const mediaRect=media.getBoundingClientRect();

   const stacked=
    mediaRect.top > txRect.top + 20;

   if(stacked){
    const gap=
     parseFloat(slStyle.rowGap) ||
     parseFloat(slStyle.gap) ||
     12;

    availableTextHeight -= mediaRect.height + gap;
   }
  }

  availableTextHeight=Math.max(90,availableTextHeight);

  tx.style.height=availableTextHeight+'px';
  tx.style.maxHeight=availableTextHeight+'px';

  /*
    DYNAMIC TEXT ONLY:
    Find the largest reading size that fits the locked text box.
    No panel, media, link, menu or navigation dimensions are changed.
  */
  let low=9.5;
  let high=innerWidth>1180 ? 18 : 17;

  for(let step=0;step<12;step++){
   const size=(low+high)/2;

   sl.style.setProperty('--reading-size',size+'px');

   /* Force measurement after the variable update. */
   void tx.offsetHeight;

   if(tx.scrollHeight<=tx.clientHeight+1){
    low=size;
   }else{
    high=size;
   }
  }

  sl.style.setProperty(
   '--reading-size',
   (Math.floor(low*10)/10)+'px'
  );
 });

 /*
   Existing mobile/portrait-tablet fitter remains authoritative there.
   On desktop/landscape tablet it simply clears/returns as designed.
 */
 fitMobileProjects();
}

document.addEventListener('click',e=>{
 const q=e.target.closest('[data-proof]'),link=e.target.closest('[data-evidence]');
 if(!q&&!link)return;
 e.stopPropagation();
 if(q)showProof(+q.dataset.proof);
 else {const a=PROOF_ANSWERS[+link.dataset.evidence];active=a.b;pos[a.b]=a.p;draw();}
},true);
showProof(0);

/* =========================
   INTERACTION AUDIO
   ========================= */
// Quiet interaction chimes from the earlier holographic portfolio.
(()=>{
 let ctx,master,last=0;
 async function chime(hz){
  if(document.hidden||performance.now()-last<180)return;
  last=performance.now();
  try{
   if(!ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;ctx=new Audio();master=ctx.createGain();master.gain.value=.075;master.connect(ctx.destination)}
   if(ctx.state!=='running')await ctx.resume();
   if(document.hidden)return;
   const now=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
   o.type='sine';o.frequency.setValueAtTime(hz,now);o.frequency.exponentialRampToValueAtTime(hz*.85,now+.2);
   g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.05,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.24);
   o.connect(g);g.connect(master);o.start();o.stop(now+.26);o.onended=()=>{o.disconnect();g.disconnect()};
  }catch{}
 }
 document.addEventListener('click',e=>{if(e.target.closest('button:disabled'))return;if(e.target.closest('button,a,.toc li,.gut h2,.sl'))chime(e.target.closest('.pv')?440:660)});
 document.addEventListener('keydown',e=>{if(!e.repeat&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape'].includes(e.key))chime(e.key==='ArrowLeft'||e.key==='Escape'?440:587)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)ctx?.suspend().catch(()=>{})});
 window.addEventListener('pagehide',()=>ctx?.suspend().catch(()=>{}));
})();
/* =========================
   PANEL ANIMATION
   ========================= */
// Decorative effects never intercept navigation or touch gestures.
(()=>{
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const fine=matchMedia('(hover: hover) and (pointer: fine)');
 let pointerFrame=0;
 bands.forEach(b=>b.addEventListener('pointermove',e=>{
  if(!fine.matches||reduced.matches||!b.classList.contains('on'))return;
  cancelAnimationFrame(pointerFrame);
  const x=e.clientX,y=e.clientY;
  pointerFrame=requestAnimationFrame(()=>{const r=b.getBoundingClientRect();b.style.setProperty('--pointer-x',`${x-r.left}px`);b.style.setProperty('--pointer-y',`${y-r.top}px`)});
 },{passive:true}));
 let previousState='';
 drawEffects.push(() => {
  const state = active + ':' + pos.join(',');
  if (state !== previousState && !reduced.matches) {
   const band = bands[active];
   band.classList.remove('holo-scan');
   requestAnimationFrame(() => band.classList.add('holo-scan'));
  }
  previousState = state;
 });
 bands.forEach(b=>b.addEventListener('animationend',()=>b.classList.remove('holo-scan')));
})();
/* =========================
   PROJECT DROPDOWNS
   ========================= */
// Phone reading mode: one full-height project, with explicit project selection.
(()=>{
 const phone=matchMedia('(max-width:1180px)');
 bands.forEach((band,i)=>{
  const select=document.createElement('select');select.className='mobile-project-select';select.setAttribute('aria-label','Choose project in '+B[i].n);
  const titles=B[i].resume?B[i].i.map(p=>p.t):['Overview',...B[i].i.map(p=>p.t)];
  titles.forEach((t,j)=>select.add(new Option(t,String(j))));
  band.querySelector('.gut').append(select);
  select.addEventListener('click',e=>e.stopPropagation());
  select.addEventListener('keydown',e=>e.stopPropagation());
  select.addEventListener('change',()=>{pos[i]=Number(select.value);active=i;draw()});
 });
 let last=active+':'+pos[active];
 drawEffects.push(() => {bands.forEach((b,i)=>b.querySelector('.mobile-project-select').value=String(pos[i]));const state=active+':'+pos[active];
  if(phone.matches&&state!==last){const b=bands[active];b.querySelectorAll('.sl')[pos[active]].scrollTop=0;requestAnimationFrame(()=>b.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'}))}last=state;
 });
})();

/* =========================
   BACKGROUND PARALLAX
   ========================= */
// Futuristic background interaction. Decorative only; never intercepts UI input.
(()=>{
  const bg=document.querySelector('.ambient-bg');
  if(!bg) return;
  const items=[...bg.querySelectorAll('.parallax')];
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tx=0,ty=0,cx=0,cy=0,raf=0;

  const render=()=>{
    cx+=(tx-cx)*.08;
    cy+=(ty-cy)*.08;
    bg.style.setProperty('--mx',`${50+cx*22}%`);
    bg.style.setProperty('--my',`${50+cy*18}%`);
    items.forEach(el=>{
      const d=parseFloat(el.dataset.depth||'.2');
      el.style.translate=`${cx*d*30}px ${cy*d*24}px`;
    });
    if(Math.abs(tx-cx)>.001||Math.abs(ty-cy)>.001) raf=requestAnimationFrame(render);
    else raf=0;
  };

  const move=e=>{
    if(reduce) return;
    tx=(e.clientX/window.innerWidth-.5)*2;
    ty=(e.clientY/window.innerHeight-.5)*2;
    if(!raf) raf=requestAnimationFrame(render);
  };
  window.addEventListener('pointermove',move,{passive:true});
})();



/* =========================
   LOCKED-PANEL TEXT FITTING
   Called by the shared layout scheduler after desktop sizing is reset.
   Only the text-size variable changes; panel and media dimensions stay fixed.
   ========================= */
function fitMobileProjects() {
 const locked = matchMedia('(max-width:700px), (min-width:701px) and (max-width:1180px) and (orientation:portrait)').matches;
 if (!locked) {
  document.querySelectorAll('.sl').forEach(slide => slide.style.removeProperty('--reading-size'));
  return;
 }
 const slide = bands[active].querySelectorAll('.sl')[pos[active]];
 if (slide.classList.contains('resume-slide') || slide.classList.contains('proof-overview')) return;
 const text = slide.querySelector('.tx');
 slide.classList.remove('text-compact');

 // Check real line boxes, not rounded scrollHeight alone. Reserve room below
 // the final line and reject horizontal overflow in either label/value column.
 function fits() {
  const box = text.getBoundingClientRect();
  const walker = document.createTreeWalker(text, NodeFilter.SHOW_TEXT);
  const range = document.createRange();
  let node;
  while ((node = walker.nextNode())) {
   if (!node.textContent.trim()) continue;
   range.selectNodeContents(node);
   for (const line of range.getClientRects()) {
    if (line.bottom > box.bottom - 5 || line.left < box.left - .5 ||
        line.right > box.right + .5) return false;
   }
  }
  return true;
 }
 const minimum = 10;
 slide.style.setProperty('--reading-size', minimum + 'px');
 if (!fits()) slide.classList.add('text-compact');
 let low = minimum, high = innerWidth <= 700 ? 24 : 28;
 // Extremely short viewports may need a final text-only reduction.
 while (!fits() && low > 8.5) {
  low = Math.round((low - .1) * 10) / 10;
  slide.style.setProperty('--reading-size', low + 'px');
 }
 for (let step = 0; step < 12; step++) {
  const size = (low + high) / 2;
  slide.style.setProperty('--reading-size', size + 'px');
  if (fits()) low = size;
  else high = size;
 }
 slide.style.setProperty('--reading-size', (Math.floor(low * 10) / 10) + 'px');
}
</script>
