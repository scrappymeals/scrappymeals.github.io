<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Damon Versaggi | COMPLEX CREATIVE + TECHNOLOGY SYSTEMS LEADER</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0d;--gr:#17191b;--ed:#2b2f33;--tx:#e8eaec;--mu:#9aa1a8;--br:#00e5e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.5 Archivo,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;padding:10px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:4px 6px 6px;flex:none}
header h1{font:800 40px/.92 Archivo,system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase}
header p{color:var(--mu);font-size:13px;max-width:60ch;margin-top:4px}
.hb{display:flex;gap:14px;font:500 12px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.hb button:hover{color:var(--tx)}
.hb .go{color:var(--br)}
.band{flex:2 1 0;min-height:64px;display:flex;background:
linear-gradient(27deg,#151515 5px,transparent 5px) 0 5px,linear-gradient(207deg,#151515 5px,transparent 5px) 10px 0,linear-gradient(27deg,#222 5px,transparent 5px) 0 10px,linear-gradient(207deg,#222 5px,transparent 5px) 10px 5px,linear-gradient(90deg,#1b1b1b 10px,transparent 10px),linear-gradient(#1d1d1d 25%,#1a1a1a 25%,#1a1a1a 50%,transparent 50%,transparent 75%,#242424 75%,#242424);background-color:#131313;background-size:20px 20px;border:1px solid var(--ed);border-top-color:#4a4f55;border-radius:6px;overflow:hidden;position:relative;transition:flex-grow .55s cubic-bezier(.7,0,.2,1),border-color .3s;box-shadow:inset 0 0 60px #000c}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#000a,transparent 18%,transparent 82%,#000a)}
.band.on{flex-grow:7;border-color:#5b6168}
.gut{flex:none;width:248px;padding:14px 16px;display:flex;flex-direction:column;background:#0d0e0fe6;border-right:1px solid var(--ed);z-index:2}
.gut h2{font:700 14px/1.35 Archivo,sans-serif;letter-spacing:.20em;cursor:pointer;flex:none}
.toc{list-style:none;padding:0;margin:16px 0 8px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.toc li{font:500 14px/1.3 Archivo,sans-serif;letter-spacing:.01em;color:#565c62;padding:9px 2px;border-top:1px solid var(--ed);cursor:pointer;transition:color .2s;white-space:normal;overflow:visible;word-break:normal}
.toc li:first-child{border-top:0}
.toc li:hover{color:var(--mu)}
.toc li b{display:block;font:700 10.5px Archivo,sans-serif;letter-spacing:.16em;color:#454a4f;margin-bottom:3px}
.toc li.next{color:var(--tx)}
.toc li.next b{color:var(--mu)}
.toc li.cur{color:var(--br)}
.toc li.cur b{color:#398c8e}
.ctl{display:flex;align-items:center;gap:8px;font:500 13px Archivo,sans-serif;letter-spacing:.12em;color:var(--mu);flex:none}
.ctl button{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--ed);border-radius:3px;background:linear-gradient(#212427,#141618);box-shadow:inset 0 1px #ffffff12;transition:border-color .2s,transform .12s,color .2s}.ctl button svg{transition:transform .2s}.ctl .nx{border-color:#246466;color:var(--br)}.ctl .pv:hover:not(:disabled) svg{transform:translateX(-3px)}.ctl .nx:hover:not(:disabled) svg{transform:translateX(3px)}.ctl button:active:not(:disabled){transform:scale(.94)}.ctl .ct{margin-left:6px;letter-spacing:.08em}
.ctl button:hover:not(:disabled){border-color:var(--br)}
.ctl button:disabled{opacity:.3;cursor:default}
.bar{height:2px;background:var(--ed);margin:8px 0}
.bar i{display:block;height:100%;background:var(--br);width:0;transition:width .5s}
.vp{flex:1;overflow:hidden;position:relative;touch-action:pan-y;z-index:1}
.trk{display:flex;height:100%;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.sl{flex:none;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.95fr);gap:22px;padding:14px 24px;align-items:center;overflow:auto}
.sl h3{font:800 clamp(27px,4vw,54px)/.98 Archivo,system-ui,sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#fff}
.sub{color:var(--br);margin:8px 0 18px;font:700 clamp(15px,1.4vw,19px)/1.25 Archivo,system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase}
.blk{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;padding:8px 0;border-top:1px solid var(--ed);max-width:66ch}
.blk b{font:600 10.5px Archivo,sans-serif;letter-spacing:.2em;color:var(--mu);padding-top:4px}
.blk span{color:#cfd3d7}
.ph{aspect-ratio:16/10;max-height:100%;border:1px solid var(--ed);border-radius:4px;position:relative;background:linear-gradient(135deg,#1c1e21,#0e0f10);background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px;display:flex;align-items:flex-end;padding:12px;font:500 10.5px Archivo,sans-serif;letter-spacing:.22em;color:#666d74}
.ph::before,.ph::after{content:"";position:absolute;width:14px;height:14px;border:1px solid #555b61}
.ph::before{top:8px;left:8px;border-right:0;border-bottom:0}.ph::after{top:8px;right:8px;border-left:0;border-bottom:0}
.ex{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 28px;margin-top:10px}
.ex div{border-top:1px solid var(--ed);padding:8px 0}.ex strong{display:block;font:700 20px/1.15 Archivo,system-ui,sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#fff}.ex small{color:var(--mu);font-size:13px}
.note{grid-column:1/-1;color:var(--mu);font-size:13px;max-width:76ch}
/* collapsed state: only title stays */
.band:not(.on) .sl>*:not(.tx),.band:not(.on) .tx>*:not(h3):not(.sub),.band:not(.on) .sub.ad{display:none}
.band:not(.on) .sub{margin:5px 0 0;font-size:clamp(11px,1vw,15px);white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;max-width:100%}
.band:not(.on) .sl{align-items:center;padding:4px 20px;overflow:visible}
.band:not(.on) .sl h3{font-size:clamp(18px,2vw,28px);white-space:normal;overflow:visible;text-overflow:clip;line-height:.98;max-width:100%}
.band:not(.on){cursor:pointer}.band:not(.on) .ctl button{display:none}.band:not(.on) .toc{display:none}
/* coda */
.coda{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(14px + env(safe-area-inset-bottom,0px))}
.coda.open{display:flex}
.cs{max-width:920px;margin:auto 0;width:100%;align-self:center;overflow:auto}
.cs h2{font:800 clamp(36px,7vw,78px)/.92 Archivo,system-ui,sans-serif;margin-bottom:20px;letter-spacing:.005em;text-transform:uppercase;color:#fff}
.cs p,.cs li{color:#cfd3d7;max-width:70ch;margin-bottom:6px}
.cs ul{list-style:none;padding:0}.cs li{border-top:1px solid var(--ed);padding:7px 0}
.cs a{color:var(--br)}
.grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.grp h4{font:600 11px Archivo,sans-serif;letter-spacing:.22em;color:var(--br);margin-bottom:6px}.grp p{font-size:13.5px;margin:0}
.dlbtn{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:12px 20px;border:1px solid var(--br);border-radius:3px;background:var(--br);color:#000!important;font:600 12px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:transform .12s,filter .2s}
.dlbtn:hover{filter:brightness(1.08)}.dlbtn:active{transform:scale(.97)}.dlbtn svg{width:16px;height:16px}
.cnav{display:flex;justify-content:space-between;align-items:center;font:500 12px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.cnav button{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--ed);padding:10px 18px;border-radius:3px;background:var(--gr)}.cnav button:hover{border-color:var(--br)}

@media(max-width:1100px){
  .gut{width:224px}
  .sl h3{font-size:clamp(24px,3.6vw,46px)}
  .sub{font-size:clamp(14px,1.25vw,18px)}
}

@media(max-width:800px){
html,body{overflow:auto}.app{height:100dvh}
header{flex-direction:column;align-items:flex-start}header h1{font-size:30px}header p{font-size:12px}
.band{flex-direction:column;min-height:74px}.gut{width:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--ed);gap:8px}.gut h2{font-size:10px}.gut .bar{display:none}.gut .toc{display:none}
.sl{grid-template-columns:1fr;gap:12px;padding:12px 16px;align-content:start}.ph{aspect-ratio:16/6}
.blk{grid-template-columns:1fr}.band.on{flex-grow:8}
.band:not(.on){flex-grow:1}
}

/* --- responsive hardening: tablet + mobile --- */

/* Tablet */
@media (max-width:1024px){
  .app{padding:8px;gap:6px}
  header{gap:12px;padding-inline:4px}
  header h1{font-size:clamp(30px,4.6vw,38px)}
  header p{max-width:56ch}
  .hb{font-size:11px;letter-spacing:.11em}

  .gut{width:210px;padding:12px 13px}
  .gut h2{font-size:12px;letter-spacing:.18em}
  .toc li{font-size:12.5px;padding:8px 2px}
  .toc li b{font-size:9.5px}

  .sl{grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);gap:18px;padding:14px 18px}
  .sl h3{font-size:clamp(24px,4vw,44px)}
  .sub{font-size:clamp(13px,1.55vw,17px)}
  .blk{grid-template-columns:82px 1fr;gap:4px 12px}
}

/* Narrow tablet / large phone: keep the visual system, stack slide content */
@media (max-width:900px){
  .sl{grid-template-columns:1fr;align-content:start;gap:12px;padding:14px 18px}
  .ph{width:100%;max-height:none;aspect-ratio:16/7}

}

    height:auto;

    padding:
      calc(8px + env(safe-area-inset-top,0px))

  .band:not(.on) .sl{
    min-height:28px;

  }
  .band:not(.on) .sl h3{

  }

  .coda{
    position:fixed;

      calc(12px + env(safe-area-inset-top,0px))

  }
  .cs{

/* Small phones */
@media (max-width:480px){
  .app{padding-left:6px;padding-right:6px}
  header h1{font-size:clamp(27px,10vw,34px)}

}

/* Touch devices: remove hover dependence and keep controls easy to tap */
@media (hover:none){
  .toc li:hover{color:inherit}
  .ctl .pv:hover:not(:disabled) svg,
  .ctl .nx:hover:not(:disabled) svg{transform:none}
}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.dlbtn,
.dlbtn:link,
.dlbtn:visited,
.dlbtn:hover,
.dlbtn:active{
  color:#000!important;
  -webkit-text-fill-color:#000!important;
  text-shadow:none!important;
}
.dlbtn svg{
  color:#000!important;

.ph.has-photo{padding:0;overflow:hidden;min-width:0;background:#101214;isolation:isolate}

a{text-transform:uppercase}

 .band.on .sl{overflow:hidden;gap:16px;padding:12px 18px}

/* Softer inactive-tier hierarchy: visible, subdued, and spatially layered. */
.band:not(.on){
  opacity:.66;

  background:linear-gradient(125deg,rgba(52,61,70,.76),rgba(29,37,47,.84) 48%,rgba(47,43,61,.76));
  border-color:rgba(166,198,202,.18);
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 3px 10px rgba(0,0,0,.18);
}

/* Tiers above the active section stay subdued but slightly lighter. */
.band:not(.on):has(~ .band.on){
  opacity:.66;
  filter:saturate(.58) brightness(.78);
}

/* Tiers below the active section sit farther back and are the darkest. */
.band.on ~ .band:not(.on){
  opacity:.56;
  filter:saturate(.46) brightness(.68);
}

.band:not(.on)::after{

{n:"AI PRODUCTS",l:"AI PRODUCTS BUILT AROUND REAL USERS, REAL WORKFLOWS AND MEASURABLE PERFORMANCE.",i:[
R("Fridgie Smalls","A production AI product shaped from concept through launch, scale and optimization.",[["THE PRODUCT", "Designed and launched a mobile-first recipe platform powered by the OpenAI API, combining ingredient-based generation, voice input, substitutions, grocery support and a persistent cookbook experience."], ["MY ROLE", "Founder and product lead, responsible for product strategy, UX, prototyping, technical architecture, deployment, prompt systems and ongoing performance optimization."], ["THE RESULTS", "Launched in February 2024 and scaled to nearly 20,000 users. Reduced input-token usage by 72%, lowered tokens per call by roughly 40%, improved response time by about two seconds and reached roughly 4,000 requests per $1."], ["LEADERSHIP", "Directed designers, developers, freelancers and restaurant partners while also building and leading a 16-person internship cohort with structured briefs, critique and hands-on mentorship."]]),
R("eFundex","Modernizing a data-heavy lending operation through workflow design, automation and decision-support systems.",[["MY ROLE", "Progressed from Product, Technology & Growth Advisor (2016–Dec 2023) to Vice President, Sales & Technology (Jan 2024–Present), expanding from advisory work into direct operational and technology leadership."], ["THE BUSINESS", "Small-business financial technology operating across lending, sales and customer acquisition. I work across leadership, operations, growth, technology and communications to improve how the business functions."], ["THE BUILD", "Architected an AI-assisted UCC intelligence platform that converts raw public filing exports into structured debtor records, secured-party intelligence, contact files, campaign segments, tracking and audit logs."], ["DECISION SUPPORT", "Developed Lead Heat Score and Stack Depth Score models to prioritize prospects, surface stacking risk and support more targeted outreach and underwriting decisions."]])]},
{n:"INTERACTIVE EXPERIENCES",l:"EXPERIENCES THAT CONNECT DIGITAL SYSTEMS, PHYSICAL SPACE, CONTENT AND PARTICIPATION.",i:[
R("Scrappy Meals XR","An independent platform that evolved from food education into immersive media, interactive products and original IP.",[["THE ORIGIN", "Founded in 2016 as a sustainability-focused food venture, then expanded into food education, experiential programming and technology. Early concepts such as Scrappy Snacks turned unused office-fridge ingredients into participatory food-waste education."], ["THE GROWTH", "Expanded the platform through catering, classes, pop-ups, a PIX11 cooking segment and the children’s book Scraps Food Guide from A–Z. The work led to invitations to testify before New York City Council on food-waste legislation and present the book and tour plans at the United Nations in September 2018."], ["THE PIVOT", "When COVID eliminated the planned March 2020 book tour and in-person programming, I redirected the platform into digital products, building The Metacheese, interactive 3D menus and later AI-powered food experiences."], ["MY ROLE", "Founder, creative director and product lead across brand strategy, original IP, experiential programming, WebXR, interactive 3D and AI product development."], ["MENTORSHIP", "Created and led the Cranfield University × Scrappy Meals XR virtual internship program from 2022–2025, directing master’s-level work through structured briefs, remote collaboration, critique and mentorship."]]),
R("The Metacheese","A WebXR environment combining spatial storytelling, education, live programming and collaborative production.",[["THE CHALLENGE", "Create a persistent virtual environment where food education, original characters, live programming and remote audiences could operate inside the same experience."], ["THE BUILD", "Built The Metacheese in Mozilla Hubs as a working WebXR environment for interactive 3D content, virtual children’s readings, university collaboration and live programming. The Mozilla Hubs development team also used the space for internal R&D meetings."], ["MY ROLE", "Led concept development, visual language, spatial experience design, world-building and production as founder, creative director and creative technologist."], ["THE EXPERIENCE", "Used the environment as a platform for remote participation, university collaboration, live programming and brand activation."]]),
R("ScrappyHour Events","A hybrid event format designed to make remote and in-person audiences equally part of the experience.",[["THE CHALLENGE", "Design a format in which live and remote audiences could participate together rather than treating the online audience as a passive feed."], ["THE BUILD", "Combined chefs, live instruction, projection, hybrid demonstrations and audience participation into a single event system, including a Brooklyn × Sweden crossover."], ["MY ROLE", "Designed the event experience and production environment across food, hospitality, content, technology and audience participation."], ["THE RESULT", "Established an early physical-to-digital model for Scrappy Meals that later informed its XR, character and interactive product work."]]),
R("3D Menus","Using WebAR and photogrammetry to turn the menu into an interactive product experience.",[["THE EXPERIENCE", "Created QR-triggered menus using photogrammetry-scanned dishes, allowing diners to inspect food in 3D and augmented reality before ordering."], ["MY ROLE", "Owned the workflow from food capture and 3D preparation through interaction design, product visualization and AR/WebXR delivery."], ["THE PURPOSE", "Reduce the distance between physical dining and digital product visualization through a simple browser-based QR interaction."]]),
R("SwivelMeta / Outernet","Interactive concept development for a large-scale public media environment.",[["MY ROLE", "Creative Technology Consultant for SwivelMeta, 2022."], ["THE SETTING", "Outernet London, a large-scale public media environment combining immersive screens, physical presence and digital participation."], ["THE WORK", "Developed interactive concepts connecting digital participation, platform capabilities and audience experience across virtual and physical environments."]]),

}
bands.forEach((el,i)=>{
 el.addEventListener("click",e=>{
  const li=e.target.closest(".toc li");
  if(li){pos[i]=Math.max(0,Math.min(slideCount(i)-1,+li.dataset.i));max[i]=Math.max(max[i],pos[i]);active=i;draw();return;}
  if(e.target.closest(".pv"))return step(i,-1);
  if(e.target.closest(".nx"))return step(i,1);
  if(active!==i){active=i;draw();}
 else if(!e.target.closest("a,button")&&e.target.closest(".sl"))step(i,1);
 });
 el.querySelector("h2").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();active=i;draw();}});
 const vp=el.querySelector(".vp");let x0=null;
 vp.addEventListener("pointerdown",e=>x0=e.clientX);
 vp.addEventListener("pointerup",e=>{if(x0===null)return;const d=e.clientX-x0;x0=null;if(Math.abs(d)>45){e.stopPropagation();step(i,d<0?1:-1);}});
});
document.addEventListener("keydown",e=>{
 if(active<0)return;
 if(e.key==="ArrowRight")step(active,1);
 if(e.key==="ArrowLeft")step(active,-1);
 if(e.key==="ArrowUp")active=Math.max(0,active-1),draw();
 if(e.key==="ArrowDown")active=Math.min(B.length-1,active+1),draw();
});
let fitFrame;
function fitProjects(){
 cancelAnimationFrame(fitFrame);
 fitFrame=requestAnimationFrame(()=>{
  document.querySelectorAll('.sl').forEach(sl=>{
   const tx=sl.querySelector('.tx');
   const media=sl.querySelector('.project-media');
   const photo=media?.querySelector('.ph');

   if(tx){
    tx.style.zoom='1';
    tx.style.removeProperty('--card-row-padding');
   }
   if(media){
    media.style.zoom='1';
    media.style.maxWidth='';
    media.style.height='';
   }
   if(photo){
    photo.style.width='';
    photo.style.height='';
    photo.style.marginInline='';
   }

   sl.classList.remove('fit-dense','fit-tight');

   if(innerWidth<=1180 || !sl.closest('.band')?.classList.contains('on')) return;

   /* Preserve existing image/link column sizing exactly. */
   if(media && photo){
    const style=getComputedStyle(sl);
    const available=sl.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
    if(available>0){
      const links=media.querySelector('.project-links');
      const linkHeight=links ? links.getBoundingClientRect().height+8 : 0;
      media.style.height=available+'px';
      photo.style.width='100%';
      photo.style.height=Math.max(120,available-linkHeight)+'px';
    }
   }

   /* Fit text inside the panel without scrollbars or CSS zoom. */
   if(!tx) return;
   const availableH=sl.clientHeight-parseFloat(getComputedStyle(sl).paddingTop)-parseFloat(getComputedStyle(sl).paddingBottom);
   if(tx.scrollHeight>availableH){
    sl.classList.add('fit-dense');
    void sl.offsetHeight;
   }
   if(tx.scrollHeight>availableH){
    sl.classList.remove('fit-dense');
    sl.classList.add('fit-tight');
   }
  });
 });
}
new ResizeObserver(fitProjects).observe(document.querySelector('.app'));
bands.forEach(b=>{new ResizeObserver(fitProjects).observe(b);b.addEventListener('transitionend',fitProjects)});
window.addEventListener('resize',fitProjects);
document.fonts.ready.then(fitProjects);
const originalDraw=draw;
draw=function(){originalDraw();fitProjects()};
draw();
// Quiet interaction chimes from the earlier holographic portfolio.
(()=>{
 let ctx,master,last=0;
 async function chime(hz){
  if(document.hidden||performance.now()-last<180)return;
  last=performance.now();
  try{
   if(!ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;ctx=new Audio();master=ctx.createGain();master.gain.value=.075;master.connect(ctx.destination)}
   if(ctx.state!=='running')await ctx.resume();
   if(document.hidden)return;
   const now=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
   o.type='sine';o.frequency.setValueAtTime(hz,now);o.frequency.exponentialRampToValueAtTime(hz*.85,now+.2);
   g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.05,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.24);
   o.connect(g);g.connect(master);o.start();o.stop(now+.26);o.onended=()=>{o.disconnect();g.disconnect()};
  }catch{}
 }
 document.addEventListener('click',e=>{if(e.target.closest('button:disabled'))return;if(e.target.closest('button,a,.toc li,.gut h2,.sl'))chime(e.target.closest('.pv,#cb')?440:660)});
 document.addEventListener('keydown',e=>{if(!e.repeat&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape'].includes(e.key))chime(e.key==='ArrowLeft'||e.key==='Escape'?440:587)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)ctx?.suspend().catch(()=>{})});
 window.addEventListener('pagehide',()=>ctx?.suspend().catch(()=>{}));
})();
// Decorative effects never intercept navigation or touch gestures.
(()=>{
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const fine=matchMedia('(hover: hover) and (pointer: fine)');
 let pointerFrame=0;
 bands.forEach(b=>b.addEventListener('pointermove',e=>{
  if(!fine.matches||reduced.matches||!b.classList.contains('on'))return;
  cancelAnimationFrame(pointerFrame);
  const x=e.clientX,y=e.clientY;
  pointerFrame=requestAnimationFrame(()=>{const r=b.getBoundingClientRect();b.style.setProperty('--pointer-x',`${x-r.left}px`);b.style.setProperty('--pointer-y',`${y-r.top}px`)});
 },{passive:true}));
 const previousDraw=draw;
 let previousState='';
 draw=function(){previousDraw();const state=active+':'+pos.join(',');if(state!==previousState&&!reduced.matches){const band=bands[active];band.classList.remove('holo-scan');requestAnimationFrame(()=>band.classList.add('holo-scan'))}previousState=state};
 bands.forEach(b=>b.addEventListener('animationend',()=>b.classList.remove('holo-scan')));
})();
// Phone reading mode: one full-height project, with explicit project selection.
(()=>{
 const phone=matchMedia('(max-width:1180px)');
 bands.forEach((band,i)=>{
  const select=document.createElement('select');select.className='mobile-project-select';select.setAttribute('aria-label','Choose project in '+B[i].n);
  const titles=B[i].resume?B[i].i.map(p=>p.t):['Overview',...B[i].i.map(p=>p.t)];
  titles.forEach((t,j)=>select.add(new Option(t,String(j))));
  band.querySelector('.gut').append(select);
  select.addEventListener('click',e=>e.stopPropagation());
  select.addEventListener('keydown',e=>e.stopPropagation());
  select.addEventListener('change',()=>{pos[i]=Number(select.value);max[i]=Math.max(max[i],pos[i]);active=i;draw()});
 });
 const prior=draw;let last=active+':'+pos[active];
 draw=function(){prior();bands.forEach((b,i)=>b.querySelector('.mobile-project-select').value=String(pos[i]));const state=active+':'+pos[active];
  if(phone.matches&&state!==last){const b=bands[active];b.querySelectorAll('.sl')[pos[active]].scrollTop=0;requestAnimationFrame(()=>b.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'}))}last=state;
 };
})();

// Futuristic background interaction. Decorative only; never intercepts UI input.
(()=>{
  const bg=document.querySelector('.ambient-bg');
  if(!bg) return;
  const items=[...bg.querySelectorAll('.parallax')];
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tx=0,ty=0,cx=0,cy=0,raf=0;

  const render=()=>{
    cx+=(tx-cx)*.08;
    cy+=(ty-cy)*.08;
    bg.style.setProperty('--mx',`${50+cx*22}%`);
    bg.style.setProperty('--my',`${50+cy*18}%`);
    items.forEach(el=>{
      const d=parseFloat(el.dataset.depth||'.2');
      el.style.translate=`${cx*d*30}px ${cy*d*24}px`;
    });
    if(Math.abs(tx-cx)>.001||Math.abs(ty-cy)>.001) raf=requestAnimationFrame(render);
    else raf=0;
  };

  const move=e=>{
    if(reduce) return;
    tx=(e.clientX/window.innerWidth-.5)*2;
    ty=(e.clientY/window.innerHeight-.5)*2;
    if(!raf) raf=requestAnimationFrame(render);
  };
  window.addEventListener('pointermove',move,{passive:true});
})();


(function(){
  function fitMobileProjects(){
    const allSlides=document.querySelectorAll('.sl');

    if(window.innerWidth>700){
      allSlides.forEach(sl=>{
        [...sl.children].forEach(el=>{
          el.style.transform='';
          el.style.transformOrigin='';
          el.style.width='';
        });
      });
      return;
    }

    document.querySelectorAll('.band.on .sl').forEach(sl=>{
      const children=[...sl.children];
      if(!children.length) return;

      children.forEach(el=>{
        el.style.transform='';
        el.style.transformOrigin='';
        el.style.width='';
      });

      const available=sl.clientHeight;
      const contentBottom=Math.max(...children.map(el=>el.offsetTop+el.offsetHeight),0);
      if(!available || !contentBottom) return;

      const ratio=Math.min(1,(available-2)/contentBottom);
      if(ratio<.995){
        children.forEach(el=>{
          el.style.transform=`scale(${ratio})`;
          el.style.transformOrigin='top left';
          if(el.classList.contains('tx') || el.classList.contains('project-media')){
            el.style.width=(100/ratio)+'%';
          }
        });
      }
    });
  }

  window.addEventListener('resize',fitMobileProjects,{passive:true});
  setTimeout(fitMobileProjects,0);
  setTimeout(fitMobileProjects,180);

  const mobileFitObserver=new MutationObserver(()=>setTimeout(fitMobileProjects,0));
  mobileFitObserver.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});
})();

</script>
